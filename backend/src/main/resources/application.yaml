spring:
  application:
    name: scpi-invest
  # Base PostgreSQL. Valeurs locales (compose.yaml) ; sur le cluster, remplacées par
  # SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD (helm.yaml : database).
  datasource:
    url: jdbc:postgresql://localhost:5432/scpi_invest
    username: app
    password: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma vient uniquement des migrations Flyway

# Niveau minimal des logs applicatifs (JSON sur stdout, cf. logback-spring.xml) ;
# LOG_LEVEL est injecté par la plateforme (helm.yaml, envList).
logging:
  level:
    root: ${LOG_LEVEL:INFO}
