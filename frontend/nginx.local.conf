# Local uniquement (compose.yaml à la racine), jamais dans l'image : nginx.conf
# + /api relayé au conteneur backend, comme la passerelle sur le cluster et
# server.proxy de vite.config.js en dev. L'hôte "backend" n'existe que dans compose.
server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/app;
    index       index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # /api/items -> http://backend:8080/items (préfixe retiré)
    location /api/ {
        proxy_pass http://backend:8080/;
    }
}
