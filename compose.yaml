# Environnement local (hors CI et hors cluster), depuis la racine du dépôt.
#
# Développement : la base seule, backend et frontend lancés avec npm run dev
#   docker compose up -d                      ->  PostgreSQL sur localhost:5432
#
# Pile complète : images construites depuis les Dockerfile, comme la CI
#   docker compose --profile full up --build  ->  http://localhost:8081
#
# Arrêt : docker compose --profile full down  (ajouter -v pour vider la base)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: scpi_invest
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      # Même URL que la valeur par défaut de backend/src/db.ts
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'app', '-d', 'scpi_invest']
      interval: 2s
      retries: 15

  # Kafka local et son interface, seulement à la demande (non démarrés par défaut) :
  #   docker compose --profile kafka up -d   ->  Kafka sur localhost:9092
  #                                              interface sur http://localhost:8090
  # puis backend avec KAFKA_BOOTSTRAP_SERVERS=localhost:9092 (backend/.env.example)
  # Images déjà présentes sur le poste : réutilisées, pas retéléchargées.
  kafka:
    profiles: [kafka]
    image: apache/kafka:latest
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Deux adresses : EXTERNE pour le Mac (backend), INTERNE pour l'interface (conteneur)
      KAFKA_LISTENERS: EXTERNE://:9092,INTERNE://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNE://localhost:9092,INTERNE://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNE:PLAINTEXT,INTERNE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Un seul serveur : une seule copie de chaque donnée interne
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    profiles: [kafka]
    image: kafbat/kafka-ui:latest
    ports:
      - '8090:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

  backend:
    profiles: [full]
    build: ./backend
    environment:
      # Même variable que sur le cluster (helm.yaml : database)
      DATABASE_URL: postgresql://app:app@postgres:5432/scpi_invest
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: [full]
    build: ./frontend
    ports:
      - '8081:8080'
    volumes:
      # Config nginx locale : ajoute /api -> backend (rôle de la passerelle sur le cluster)
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/nginx.default.conf:ro
    depends_on:
      - backend

volumes:
  postgres:
